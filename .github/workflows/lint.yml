# Source-only lint checks. These run WITHOUT building, so they need neither a
# ROS workspace build nor the closed-source int2DDS FFI library, and give fast
# PR feedback on public runners.
#
# NOTE: the C++ style/static linters (ament_cpplint, ament_clang_format,
# ament_uncrustify, ament_cppcheck) are NOT run here. action-ros-lint does not
# support them, and they are build-coupled, so they run inside `colcon test`
# (via ament_lint_common) in build.yml instead. Do not duplicate them here.
#
# Pinned to this branch's distro (foxy), like build.yml and package-deb.yml.
# No current GitHub runner image can install Foxy for setup-ros, and
# action-ros-lint needs sudo, which ros:foxy-ros-base lacks, so the job runs in
# that container and installs and runs the linter itself.
name: lint

on:
  push:
    branches: [foxy]
  pull_request:
    branches: [foxy]
  workflow_dispatch:

jobs:
  ament_lint:
    runs-on: ubuntu-22.04
    container:
      image: ros:foxy-ros-base
    strategy:
      fail-fast: false
      matrix:
        # xmllint: validates package.xml well-formedness/format.
        # Add `copyright` here ONLY after source files carry license headers,
        # otherwise ament_copyright fails every file. (See SPDX discussion.)
        linter: [xmllint]
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --quiet --yes \
            "ros-foxy-ament-$(echo '${{ matrix.linter }}' | tr '_' '-')"
      - shell: bash
        # Every package in this repository, same list as build.yml.
        run: |
          source /opt/ros/foxy/setup.bash
          ament_${{ matrix.linter }} $(colcon list -p --packages-select \
            int2dds_ffi_vendor rmw_int2dds_cpp rmw_int2dds_validation)
